<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" role="img" aria-label="Murmur HUD cycling between Listening and Transcribing">
<style>
  .cap { fill: #f4f4f6; stroke: rgba(0,0,0,0.08); }
  .lbl { fill: #1d1d1f; }
  @media (prefers-color-scheme: dark) {
    .cap { fill: #3a3a3c; stroke: rgba(255,255,255,0.12); }
    .lbl { fill: #ffffff; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 500; }
</style>
<defs>
  <filter id="sh" x="-30%" y="-60%" width="160%" height="260%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
  </filter>
</defs>
<g transform="translate(280 80)">
  <rect class="cap" x="-170" y="-42" width="340" height="84" rx="42" stroke-width="1" filter="url(#sh)"/>
  <circle cx="-120" cy="0" r="10">
    <animate attributeName="fill" values="#ff453a;#ff453a;#0a84ff;#0a84ff;#ff453a" keyTimes="0;0.48;0.52;0.98;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.25;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text class="lbl" x="-92" y="9">Listening…
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.47;0.5;0.98;1" dur="6s" repeatCount="indefinite"/>
  </text>
  <text class="lbl" x="-92" y="9" opacity="0">Transcribing…
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.53;0.98;1" dur="6s" repeatCount="indefinite"/>
  </text>
</g>
</svg>